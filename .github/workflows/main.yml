name: Build and test

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17.6.2, 18.1.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Our.Umbraco.CloudPurge.Tests/Our.Umbraco.CloudPurge.Tests.csproj -p:UmbracoVersion=${{ matrix.umbraco }}
      - run: dotnet test Our.Umbraco.CloudPurge.Tests/Our.Umbraco.CloudPurge.Tests.csproj --no-restore -p:UmbracoVersion=${{ matrix.umbraco }}
      - run: dotnet pack Our.Umbraco.CloudPurge/Our.Umbraco.CloudPurge.csproj --no-restore -p:UmbracoVersion=${{ matrix.umbraco }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check release version
        shell: bash
        run: |
          package_version=$(dotnet msbuild Our.Umbraco.CloudPurge/Our.Umbraco.CloudPurge.csproj -getProperty:Version)
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
      - name: Pack release
        run: dotnet pack Our.Umbraco.CloudPurge/Our.Umbraco.CloudPurge.csproj --configuration Release --output artifacts
      - name: NuGet trusted publishing login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push 'artifacts/*.nupkg' --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
